    :root { --bg:#0a0a0e; --accent:#ff4d4d; --accent-2:#ff8800; --text:#e8e8e8; --muted:#9a9aa2; --border:#26262e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }

    .badge { display:inline-block; font-size:0.75rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:3px; padding:0.45rem 1.2rem; margin-bottom:1.25rem; box-shadow:0 0 18px rgba(255,77,77,0.25); }
    .teaser { font-size:1.05rem; font-style:italic; color:#fff; margin-bottom:0.4rem; }
    .teaser-en { font-size:0.85rem; color:var(--muted); margin-bottom:2rem; }
    .btn-group { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
    .btn { display:inline-block; font-family:'Anton',sans-serif; font-size:1.05rem; letter-spacing:2px; text-transform:uppercase; text-decoration:none; padding:0.7rem 1.6rem; border:1px solid var(--border); color:#fff; transition:all 0.2s ease; }
    .btn-primary { border-color:var(--accent); color:var(--accent); }
    .btn-primary:hover { background:var(--accent); color:#000; box-shadow:0 0 18px rgba(255,77,77,0.4); }
    .btn:hover:not(.btn-primary) { border-color:#fff; }
    .legal { font-size:0.72rem; color:var(--muted); font-style:italic; margin-top:2rem; }
    footer { text-align:center; padding:1.25rem 1rem; font-size:0.78rem; color:var(--muted); border-top:1px solid var(--border); }
    footer a { color:var(--text); text-decoration:none; }
    footer a:hover { color:var(--accent); }
